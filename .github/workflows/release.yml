name: Release

# Builds installers for every OS and attaches them to a DRAFT GitHub release.
# Runs only when a version tag is pushed (v2.0.0, v2.0.1, ...). Nothing is published until a
# maintainer reviews the draft. Signing secrets are optional: without them builds are unsigned.

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag from the Actions tab if a build failed.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { os: macos-latest, args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { os: windows-latest, args: "", target: "" }
          - { os: ubuntu-22.04, args: "", target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxcb1-dev libxcb-screensaver0-dev cmake patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Empty APPLE_* variables make Tauri try to sign with a blank certificate and fail.
      # Export them only when the secrets are actually configured.
      - name: Apple signing (only if secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple signing secrets: building an unsigned app."; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TaskMind ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Unsigned builds show a security warning on first open (see docs/INSTALL.md)."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
